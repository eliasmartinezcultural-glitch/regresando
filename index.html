<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8dfcc">
<meta name="description" content="Un refugio digital patagónico para bajar el ritmo.">
<title>El Refugio — sin apuro</title>
<style>
:root{--ink:#332d25;--paper:#f8f0df;--edge:#cbb99a;--sage:#899779;--sky:#cadbd7}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#d5e1dc,#f0e2c6 62%,#b7a17d);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}button,input,textarea{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #285e70;outline-offset:3px}.top{max-width:1100px;margin:auto;padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:bold}.tag{margin-top:5px;color:#625748}.tool{border:1px solid var(--edge);background:var(--paper);border-radius:30px;padding:10px 14px;color:var(--ink)}main{max-width:1100px;margin:auto;padding:8px 14px 24px}.scene{position:relative;min-height:590px;border:1px solid #b9a889;border-radius:22px;overflow:hidden;box-shadow:0 15px 35px #4a3c2926;background:#cbd9d3}.scene svg{position:absolute;inset:0;width:100%;height:100%}.scene:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#fff2 48%,transparent 63%);background-size:220% 100%;animation:brisa 28s linear infinite}.animal{position:absolute;z-index:2;min-width:48px;min-height:48px;border:0;background:#fff5;border-radius:50%;font-size:clamp(1.7rem,3vw,2.5rem);cursor:pointer;transition:transform .5s}.animal:hover{transform:translateY(-4px)}.hen{left:65%;top:72%;animation:picotear 4s ease-in-out infinite}.duck{left:78%;top:76%;animation:picotear 5s ease-in-out infinite reverse}.sheep{left:88%;top:67%;animation:balancear 6s ease-in-out infinite}.dog{left:55%;top:80%;animation:balancear 7s ease-in-out infinite}.scene .sun{transform-origin:930px 110px;animation:sol 80s linear infinite}@keyframes brisa{0%{background-position:200% 0}100%{background-position:-220% 0}}@keyframes picotear{0%,40%,100%{translate:0 0}45%{translate:2px 3px}50%{translate:-2px 1px}}@keyframes balancear{0%,100%{translate:0 0}50%{translate:0 -3px}}@keyframes sol{0%,100%{opacity:1}50%{opacity:.75}}.welcome{position:absolute;top:18px;left:18px;background:#fff4dfdf;padding:12px 16px;border:1px solid #fff8;border-radius:12px;max-width:calc(100% - 36px)}.welcome strong{display:block;font-size:1.2rem}.object{position:absolute;min-width:78px;min-height:76px;border:1px solid transparent;border-radius:15px;background:#fff1;color:#2d2922;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:0 1px #fff8;transition:background .18s,transform .18s}.object:hover{background:#fff7;transform:translateY(-2px)}.emoji{font-size:clamp(2.2rem,5vw,3.6rem)}.label{font-size:1rem;font-weight:bold;background:#f9f0dfc9;border-radius:6px;padding:2px 5px}.music{left:8%;top:49%}.mate{left:39%;top:58%}.cinema{right:8%;top:48%}.fire{left:15%;bottom:7%}.books{right:18%;bottom:7%}.window{right:2%;top:13%}.rest{left:45%;bottom:5%}.under{text-align:center;padding:15px 8px;color:#4f483d}.panel-wrap{position:fixed;inset:0;background:#211b16a8;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}.panel-wrap.open{display:flex}.panel{background:var(--paper);width:min(700px,100%);max-height:92vh;overflow:auto;border:1px solid var(--edge);border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 22px 70px #0005}.close{float:right;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:#fff9ef;font-size:1.4rem}.panel h2{font-size:clamp(1.6rem,4vw,2.3rem);margin:6px 50px 14px 0}.panel p{font-size:1.08rem;line-height:1.65}.panel label{display:block;margin:12px 0 6px}.panel input,.panel textarea{width:100%;padding:13px;border:1px solid var(--edge);border-radius:9px;background:#fffaf0;color:var(--ink)}.panel textarea{min-height:145px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.media{width:100%;aspect-ratio:16/9;background:#211d18;border-radius:10px;overflow:hidden;margin:14px 0}.media iframe,.media video,.media audio{width:100%;height:100%;border:0;display:block}.media audio{height:54px;margin-top:30%}.small{font-size:.9rem!important;color:#5c5244}.status{min-height:1.4em;color:#426344}.footer{max-width:1100px;margin:auto;padding:0 20px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:#5d5345;font-size:.92rem}
@media(max-width:620px){.top{padding:15px 12px 8px;align-items:flex-start}.tag{max-width:210px}.tool{padding:8px;font-size:.9rem}main{padding:4px 7px 16px}.scene{min-height:620px;border-radius:14px}.music{left:1%;top:48%}.hen{left:59%;top:74%}.duck{left:74%;top:78%}.sheep{left:85%;top:68%}.dog{left:53%;top:82%}.mate{left:36%;top:58%}.cinema{right:1%;top:47%}.window{right:0;top:16%}.fire{left:3%;bottom:7%}.books{right:4%;bottom:7%}.rest{left:40%;bottom:5%}.object{min-width:65px;min-height:68px;padding:3px}.label{font-size:.88rem}.welcome{top:12px;left:12px}.footer{padding:0 12px 20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div><div class="name">El Refugio</div><div class="tag">Un lugar sin apuro · Patagonia adentro</div></div><button class="tool" id="light" aria-pressed="false">Cambiar la luz</button></header>
<main><section class="scene" aria-label="Casa patagónica ilustrada. Elegí un objeto para entrar a un rincón.">
<svg viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Una casita de campo, montañas suaves y patio patagónico"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#bfd5d3"/><stop offset="1" stop-color="#f1dfbd"/></linearGradient><linearGradient id="w" x2="0" y2="1"><stop stop-color="#efdfc1"/><stop offset="1" stop-color="#c9a87c"/></linearGradient></defs><rect width="1100" height="700" fill="url(#s)"/><circle class="sun" cx="930" cy="110" r="40" fill="#f7e7b6"/><path d="M0 365 140 240 250 320 410 190 565 330 720 225 875 335 1020 250 1100 320V700H0Z" fill="#9aaea1"/><path d="M0 440 180 320 330 390 490 290 650 400 830 310 1000 400 1100 350V700H0Z" fill="#b0b69a"/><path d="M0 520Q220 450 410 500T820 485T1100 470V700H0Z" fill="#c4b28b"/><path d="M85 420 340 255 600 420Z" fill="#806047" stroke="#674b37" stroke-width="8"/><rect x="120" y="410" width="440" height="250" fill="url(#w)" stroke="#8b6949" stroke-width="7"/><rect x="175" y="455" width="110" height="100" fill="#789b9a" stroke="#6f513a" stroke-width="8"/><path d="M230 455V555M175 505H285" stroke="#e8dcc4" stroke-width="6"/><rect x="410" y="470" width="90" height="190" fill="#79563d" stroke="#5f432e" stroke-width="7"/><circle cx="480" cy="565" r="5" fill="#f0d8a2"/><path d="M620 410H1030M650 410V660M730 410V660M810 410V660M890 410V660M970 410V660" stroke="#8d6b48" stroke-width="8"/><path d="M0 660Q250 620 520 662T1100 655V700H0Z" fill="#89966b"/><g fill="#75815f"><ellipse cx="65" cy="605" rx="28" ry="60"/><ellipse cx="1030" cy="602" rx="40" ry="70"/></g><path d="M565 665Q650 615 710 660T860 665" fill="none" stroke="#dfcda8" stroke-width="25"/></svg>
<div class="welcome"><strong>Pasá, estás en tu casa.</strong><span>Acá no hay apuro ni nada que cumplir.</span></div>
<button class="animal hen" data-animal="gallina" aria-label="Acercarse a la gallina">🐔</button><button class="animal duck" data-animal="patos" aria-label="Acercarse a los patos">🦆</button><button class="animal sheep" data-animal="oveja" aria-label="Acercarse a la oveja">🐑</button><button class="animal dog" data-animal="perro" aria-label="Saludar al perro">🐕</button>\n<button class="object music" data-open="music" aria-label="Abrir música"><span class="emoji">🎸</span><span class="label">Música</span></button>
<button class="object mate" data-open="mate" aria-label="Ir a la mesa matera"><span class="emoji">🧉</span><span class="label">La matera</span></button>
<button class="object cinema" data-open="cinema" aria-label="Abrir cine"><span class="emoji">📺</span><span class="label">Cine</span></button>
<button class="object fire" data-open="fire" aria-label="Ir al fogón"><span class="emoji">🔥</span><span class="label">Fogón</span></button>
<button class="object books" data-open="books" aria-label="Abrir lecturas"><span class="emoji">📚</span><span class="label">Lecturas</span></button>
<button class="object window" data-open="patio" aria-label="Mirar el patio"><span class="emoji">🪟</span><span class="label">Patio</span></button>
<button class="object rest" data-open="rest" aria-label="Ir al sillón"><span class="emoji">🪑</span><span class="label">Descanso</span></button>
</section><div class="under" id="whisper" aria-live="polite">El viento pasa entre los pastos. En el patio, alguien anda picoteando.</div></main>
<footer class="footer"><span>Hecho para estar, no para correr.</span><span>Sin cuenta · Sin publicidad · Tus notas quedan en este dispositivo.</span></footer>
<div class="panel-wrap" id="wrap" role="dialog" aria-modal="true" aria-labelledby="title"><section class="panel"><button class="close" id="close" aria-label="Cerrar">×</button><h2 id="title"></h2><div id="body"></div></section></div>
<script>
(function(){'use strict';
const wrap=document.getElementById('wrap'),title=document.getElementById('title'),body=document.getElementById('body');let last=null;
const pages={
mate:['La mesa matera','<p>Arrimá una silla. No hay nada que resolver ahora mismo.</p><p>Podés guardar una idea para volver a ella después.</p><label for="noteMate">Cuaderno matero privado</label><textarea id="noteMate" placeholder="Hoy, mientras tomaba unos mates…"></textarea><div class="actions"><button class="tool" data-save="noteMate">Guardar nota</button><button class="tool" data-clear="noteMate">Borrar nota</button></div><p class="status" id="statusMate" aria-live="polite"></p>'],
music:['El rincón de la música','<p>La música tiene que sonar, no quedarse en una lista. Pegá un enlace de YouTube o un archivo de audio compatible.</p><label for="urlMusic">Enlace de música</label><input id="urlMusic" type="url" placeholder="https://www.youtube.com/watch?v=…"><div class="actions"><button class="tool" id="playMusic">▶ Reproducir</button><button class="tool" id="stopMusic">Detener</button></div><div class="media" id="playerMusic"></div><p class="small" id="statusMusic" aria-live="polite">YouTube y los archivos de internet requieren conexión. Algunos enlaces no permiten reproducción dentro de otras páginas.</p>'],
cinema:['El cine de la casa','<p>Nos acomodamos y bajamos un poco la luz. Pegá un enlace de YouTube o un video directo compatible.</p><label for="urlCinema">Enlace de película o video</label><input id="urlCinema" type="url" placeholder="https://www.youtube.com/watch?v=…"><div class="actions"><button class="tool" id="playCinema">▶ Ver ahora</button><button class="tool" id="stopCinema">Detener</button></div><div class="media" id="playerCinema"></div><p class="small" id="statusCinema" aria-live="polite">El contenido externo necesita internet y puede tener restricciones. Este refugio no aloja ni descarga películas.</p>'],
fire:['Junto al fogón','<p>El viento recorre la estepa y el fuego hace su trabajo sin apurarse.</p><p>A veces, una buena historia es simplemente una tarde compartida, el olor a leña y el silencio cómodo entre dos frases.</p><label for="noteFire">Un recuerdo para guardar</label><textarea id="noteFire" placeholder="Me acuerdo de aquella tarde…"></textarea><div class="actions"><button class="tool" data-save="noteFire">Guardar nota</button><button class="tool" data-clear="noteFire">Borrar nota</button></div><p class="status" id="statusFire" aria-live="polite"></p>'],
books:['Los libros','<p><strong>Un pequeño texto para quedarse:</strong></p><p>Hay lugares que no se miden por los kilómetros, sino por la forma en que uno respira al llegar. Una mesa con marcas, una ventana que conoce el viento, una taza tibia entre las manos. Lo sencillo también puede ser un mundo entero.</p><p>Este rincón crecerá con relatos completos y lecturas que puedan abrirse aquí mismo.</p>'],
patio:['La ventana y el patio','<p>Una planta busca el sol, las herramientas descansan contra la pared y el viento va borrando las huellas del sendero.</p><p>La puerta está abierta. No hace falta llegar a ninguna parte.</p><p>Podés acercarte a los animales del patio. No hay apuro: cada uno sigue con su día.</p>'],
rest:['Un rato de descanso','<p>Aflojá los hombros. Apoyá los pies. No hace falta aprovechar este momento ni convertirlo en una tarea.</p><p id="breath">Inspirá suavemente… y soltá el aire despacio.</p><button class="tool" id="pauseAgain">Otra pausa tranquila</button>']
};
function open(key){last=document.activeElement;title.textContent=pages[key][0];body.innerHTML=pages[key][1];wrap.classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').focus();setup(key)}
function shut(){['Music','Cinema'].forEach(stop);wrap.classList.remove('open');document.body.style.overflow='';if(last)last.focus()}
function stop(suffix){const el=document.getElementById('player'+suffix);if(el)el.innerHTML='';const st=document.getElementById('status'+suffix);if(st)st.textContent='Reproducción detenida.'}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.open)));\nconst animalLines={gallina:'La gallina rasca la tierra, encuentra algo y sigue a lo suyo.',patos:'Los patos se acomodan cerca del agua. Se escucha un chapoteo suave.',oveja:'La oveja mastica tranquila entre los pastos. Por un rato, todo parece ir más despacio.',perro:'El perro mueve la cola, da una vuelta y se echa al sol.'};document.querySelectorAll('[data-animal]').forEach(b=>b.addEventListener('click',()=>{const w=document.getElementById('whisper');w.textContent=animalLines[b.dataset.animal];b.animate([{transform:'translateY(0)'},{transform:'translateY(-7px)'},{transform:'translateY(0)'}],{duration:650});}));
document.getElementById('close').addEventListener('click',shut);wrap.addEventListener('click',e=>{if(e.target===wrap)shut()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&wrap.classList.contains('open'))shut()});
function setup(key){if(key==='mate'||key==='fire'){const id=key==='mate'?'noteMate':'noteFire';const saved=localStorage.getItem('refugio_'+id);if(saved!==null)document.getElementById(id).value=saved}
body.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.save;localStorage.setItem('refugio_'+id,document.getElementById(id).value);document.getElementById(id==='noteMate'?'statusMate':'statusFire').textContent='Guardado en este dispositivo.'}));
body.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.clear;document.getElementById(id).value='';localStorage.removeItem('refugio_'+id);document.getElementById(id==='noteMate'?'statusMate':'statusFire').textContent='Nota borrada.'}));
if(key==='music'||key==='cinema'){const s=key==='music'?'Music':'Cinema';const input=document.getElementById('url'+s);input.value=localStorage.getItem('refugio_url'+s)||'';document.getElementById('play'+s).addEventListener('click',()=>play(s));document.getElementById('stop'+s).addEventListener('click',()=>stop(s));input.addEventListener('keydown',e=>{if(e.key==='Enter')play(s)})}
if(key==='rest')document.getElementById('pauseAgain').addEventListener('click',()=>document.getElementById('breath').textContent='Tomá aire suavemente y soltalo a tu propio ritmo. No hay una forma correcta.')}
function play(s){const input=document.getElementById('url'+s),target=document.getElementById('player'+s),status=document.getElementById('status'+s);let u;try{u=new URL(input.value.trim())}catch(e){status.textContent='Pegá un enlace completo y válido.';input.focus();return}if(!['https:','http:'].includes(u.protocol)){status.textContent='Usá un enlace web seguro.';return}localStorage.setItem('refugio_url'+s,u.href);target.innerHTML='';const host=u.hostname.replace(/^www\./,'').replace(/^m\./,'');let id='';if(host==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';if(host==='youtube.com'||host==='youtube-nocookie.com'){id=u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);if(!id&&m)id=m[1]}if(['youtube.com','youtube-nocookie.com','youtu.be'].includes(host)){const list=u.searchParams.get('list');const src=list&&!id?'https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(list):id?'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0':'';if(!src){status.textContent='No pude reconocer el enlace de YouTube.';return}const frame=document.createElement('iframe');frame.src=src;frame.title=s==='Music'?'Reproductor de música':'Reproductor de cine';frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';frame.allowFullscreen=true;target.appendChild(frame);status.textContent='Reproductor cargado. La reproducción depende de que el video permita inserción.';return}
const path=u.pathname.toLowerCase(),audio=/\.(mp3|m4a|ogg|wav|aac)$/.test(path),video=/\.(mp4|webm|ogv|mov)$/.test(path);if((s==='Music'&&audio)||(s==='Cinema'&&video)){const el=document.createElement(s==='Music'?'audio':'video');el.src=u.href;el.controls=true;el.autoplay=true;el.playsInline=true;target.appendChild(el);el.play().catch(()=>status.textContent='Tocá reproducir. El servidor puede limitar el acceso al archivo.');status.textContent='Reproductor listo.';return}const frame=document.createElement('iframe');frame.src=u.href;frame.title='Contenido externo';frame.allow='autoplay; fullscreen';frame.allowFullscreen=true;target.appendChild(frame);status.textContent='Intentando abrir el contenido. Algunos sitios bloquean la inserción.'}
document.getElementById('light').addEventListener('click',function(){const night=document.body.dataset.night!=='yes';document.body.dataset.night=night?'yes':'no';document.querySelector('.scene').style.filter=night?'brightness(.72) saturate(.8)':'';document.body.style.background=night?'linear-gradient(#7a817f,#a0937c 62%,#6e5c48)':'';this.setAttribute('aria-pressed',String(night));this.textContent=night?'Volver a la luz':'Cambiar la luz'});
})();
</script>
</body></html>
