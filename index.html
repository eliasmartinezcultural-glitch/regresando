<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8c6a5"><meta name="description" content="Un mundo rural patagónico para habitar sin apuro.">
<title>El Refugio — un mundo sin apuro</title>
<style>
:root{--ink:#30291f;--paper:#f5ead4;--edge:#bca47f;--wood:#79563b;--sage:#8c9871}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:#c9d7cf}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2d6370;outline-offset:3px}
header{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:linear-gradient(#201c17a8,transparent);color:#fff9e9}.brand{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:bold;text-shadow:0 2px 5px #322}.brand small{display:block;font-size:.8rem;font-weight:normal;opacity:.9}.head-actions{display:flex;gap:8px}.soft-btn{border:1px solid #f8ecd0a0;border-radius:24px;padding:9px 13px;background:#fff0;color:inherit}.world{height:100svh;min-height:570px;position:relative;overflow:hidden;background:#b6c9c6}.scene{position:absolute;inset:0;display:none;overflow:hidden;isolation:isolate}.scene.active{display:block;animation:arrive .65s ease both}@keyframes arrive{from{opacity:.35}to{opacity:1}}
.horizon-sky{position:absolute;inset:0 0 35%;background:linear-gradient(#a9c7cb 0%,#dbe0cf 68%,#f2d9ae 100%)}.sun{position:absolute;top:12%;right:16%;width:clamp(45px,8vw,95px);aspect-ratio:1;border-radius:50%;background:#f7e5b1;box-shadow:0 0 65px #ffe6b255}.mountain{position:absolute;left:-5%;right:-5%;bottom:31%;height:38%;background:#94a69a;clip-path:polygon(0 68%,13% 28%,22% 53%,39% 7%,53% 58%,67% 24%,81% 63%,91% 38%,100% 64%,100% 100%,0 100%)}.mountain.back{bottom:27%;height:34%;background:#b5b79e;clip-path:polygon(0 54%,14% 30%,29% 61%,47% 16%,60% 55%,78% 25%,100% 61%,100% 100%,0 100%)}.ground{position:absolute;inset:62% 0 0;background:linear-gradient(#b6b186,#8f9a6e)}.grass{position:absolute;bottom:0;left:0;right:0;height:16%;background:repeating-linear-gradient(100deg,transparent 0 17px,#6e8056 18px 20px,transparent 21px 40px);opacity:.55;transform-origin:bottom;animation:grass 8s ease-in-out infinite alternate}@keyframes grass{to{transform:skewX(1deg) scaleY(.96)}}
.hotspot{position:absolute;z-index:3;border:1px solid #fff8;background:#f8eddaeb;color:#342b20;border-radius:15px;padding:9px 12px;box-shadow:0 4px 16px #382d1c30;display:flex;align-items:center;gap:8px;max-width:90%;font-weight:bold}.hotspot .big{font-size:1.8rem}.hint{position:absolute;z-index:3;bottom:15px;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;background:#fff0dbe8;border-radius:20px;padding:8px 14px;font-size:.95rem}
.scene-title{position:absolute;z-index:2;top:84px;left:18px;color:#fff8e9;text-shadow:0 2px 7px #30271d;font-size:clamp(1.4rem,3vw,2rem)}
/* interior: first-person view into a room, no outside house illustration */
.inside{background:#d8c5a3}.inside .backwall{position:absolute;inset:0 0 29%;background:linear-gradient(90deg,#bda17c,#e6d2ad 42%,#d8bd91);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.inside .ceiling{position:absolute;inset:0 0 auto;height:13%;background:repeating-linear-gradient(90deg,#73533a 0 7px,#8b6847 8px 70px);border-bottom:8px solid #60452f}.inside .floor{position:absolute;inset:68% 0 0;background:repeating-linear-gradient(90deg,#8a6444 0 3px,#b58b5e 4px 120px);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.inside .rug{position:absolute;bottom:3%;left:27%;width:47%;height:22%;background:#9d7956;border:8px double #d3b78b;transform:perspective(220px) rotateX(15deg);border-radius:8px}.windowframe{position:absolute;top:18%;left:8%;width:28%;height:34%;border:12px solid #755035;background:linear-gradient(#b4ced0 0 45%,#8fa38a 46% 70%,#c1b58b 71%);box-shadow:inset 0 0 0 4px #e3d0ae}.windowframe:before{content:'';position:absolute;top:0;bottom:0;left:48%;width:7px;background:#755035}.windowframe:after{content:'';position:absolute;left:0;right:0;top:48%;height:7px;background:#755035}.shelf{position:absolute;top:21%;right:9%;width:25%;height:10%;background:#785337;border:5px solid #60452f;box-shadow:0 10px 0 #b28a5e}.shelf:before{content:'📚　🪴　🏺';position:absolute;bottom:100%;left:0;font-size:clamp(1.3rem,3vw,2.3rem);white-space:nowrap}.stove{position:absolute;bottom:24%;left:9%;width:13%;height:27%;background:linear-gradient(90deg,#34302b,#5b5145,#2b2925);border:5px solid #40352b;border-radius:9px 9px 2px 2px}.stove:before{content:'';position:absolute;bottom:15%;left:18%;width:64%;height:37%;background:radial-gradient(ellipse,#ffcc70 0%,#db642e 38%,#211b17 72%);border:4px solid #211d19;border-radius:4px}.stove:after{content:'';position:absolute;bottom:100%;left:35%;width:30%;height:48%;background:#6a5440;border:3px solid #4d3b2b}.table{position:absolute;bottom:21%;left:37%;width:35%;height:8%;background:#9a7049;border:5px solid #69482e;box-shadow:0 12px 0 #6e4a2e}.table:before{content:'🧉　🍞';position:absolute;left:20%;bottom:12%;font-size:clamp(1.7rem,4vw,3rem);transform:translateY(-10px)}.table:after{content:'';position:absolute;left:12%;right:12%;top:100%;height:100px;background:linear-gradient(90deg,#68452d 0 12%,transparent 12% 83%,#68452d 83%)}.chair{position:absolute;bottom:18%;right:9%;font-size:clamp(3.3rem,8vw,6rem);filter:drop-shadow(0 7px 3px #57402d55)}.doorway{position:absolute;right:4%;top:28%;height:43%;width:16%;border:10px solid #68452e;background:linear-gradient(#a6c2c1 0 44%,#9ca27c 45%);box-shadow:inset 0 0 0 4px #b68d61}.doorway:after{content:'↗';position:absolute;bottom:7%;right:10%;font-size:2rem;color:#fff5}
/* yard and farm scenes */
.yard .path{position:absolute;bottom:-5%;left:29%;width:43%;height:49%;background:#c8b58c;clip-path:polygon(40% 0,61% 0,100% 100%,0 100%)}.fence{position:absolute;bottom:18%;left:0;right:0;height:16%;border-top:8px solid #846344;border-bottom:8px solid #846344;background:repeating-linear-gradient(90deg,transparent 0 9%,#846344 9.2% 10.2%,transparent 10.5% 18%)}.tree{position:absolute;bottom:26%;left:8%;font-size:clamp(4rem,10vw,8rem);filter:drop-shadow(0 7px 3px #564)}.barn{position:absolute;bottom:27%;right:9%;width:25%;height:29%;background:#b88761;border:7px solid #78533a}.barn:before{content:'';position:absolute;left:-12%;right:-12%;top:-30%;height:32%;background:#774e36;clip-path:polygon(50% 0,100% 100%,0 100%)}.barn:after{content:'';position:absolute;bottom:0;left:25%;width:50%;height:65%;background:#65472f;border:5px solid #d2ad7b}.well{position:absolute;bottom:16%;left:13%;font-size:clamp(2.8rem,7vw,5rem)}.animal{position:absolute;z-index:2;border:0;background:#fff0;border-radius:18px;font-size:clamp(2.6rem,6vw,5rem);filter:drop-shadow(0 5px 2px #4c463333);transition:transform .35s}.animal:hover{transform:translateY(-5px) scale(1.04)}.hen{bottom:18%;left:38%}.duck{bottom:17%;left:49%}.dog{bottom:14%;left:65%}.sheep{bottom:21%;right:9%}.trough{position:absolute;bottom:13%;left:43%;width:21%;height:35px;border:6px solid #77543a;background:#a9c0b0;border-radius:3px}.field .ground{background:linear-gradient(#9eaa79,#8c9869)}.field .fence{bottom:30%;transform:scale(.8);transform-origin:bottom}.field .barn{right:12%;bottom:31%;transform:scale(.8)}.field .animal{font-size:clamp(3rem,7vw,5.4rem)}.field .sheep{right:25%;bottom:26%}.field .dog{left:30%;bottom:20%}.field .hen{left:50%;bottom:17%}.field .duck{left:60%;bottom:19%}
.navbar{position:absolute;z-index:4;bottom:55px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(94%,700px)}.navbtn{background:#f7ecd8ee;border:1px solid #9c815d;border-radius:25px;padding:10px 14px;color:#30291f;box-shadow:0 3px 12px #392e1f22}.navbtn[aria-current=true]{background:#6d563e;color:#fff4df}.overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:#1d1914b8}.overlay.open{display:flex}.dialog{width:min(720px,100%);max-height:92svh;overflow:auto;background:var(--paper);border:1px solid var(--edge);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 20px 70px #0005}.dialog h2{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 50px 12px 0}.x{float:right;border:1px solid var(--edge);background:#fff9ed;border-radius:50%;width:44px;height:44px;font-size:1.4rem}.dialog p{font-size:1.05rem;line-height:1.6}.dialog label{display:block;margin:12px 0 6px}.dialog input,.dialog textarea{width:100%;padding:12px;border:1px solid var(--edge);border-radius:9px;background:#fffaf0;color:var(--ink)}.dialog textarea{min-height:115px}.media{margin:14px 0;background:#211e1a;aspect-ratio:16/9;border-radius:10px;overflow:hidden}.media iframe,.media video{width:100%;height:100%;border:0;display:block}.media audio{width:100%;margin-top:10%;}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{min-height:1.4em;color:#416345;font-size:.92rem}.quiet{font-size:.9rem!important;color:#655745}.toast{position:absolute;z-index:6;top:85px;left:50%;transform:translateX(-50%);background:#fff0ddec;border-radius:18px;padding:10px 15px;max-width:90%;text-align:center;box-shadow:0 3px 16px #352a1e22}.hidden{display:none!important}
@media(max-width:600px){.world{min-height:540px}.scene-title{top:76px;left:12px}.navbar{bottom:50px;gap:6px}.navbtn{padding:9px 11px;font-size:.9rem}.hint{bottom:10px;font-size:.84rem}.inside .stove{left:4%;width:16%}.inside .table{left:29%;width:40%}.inside .chair{right:3%}.inside .windowframe{left:4%;width:30%}.inside .shelf{right:3%;width:27%}.yard .barn{right:4%;width:29%}.sheep{right:3%}.yard .tree{left:1%}.doorway{right:2%;width:19%}.head-actions .soft-btn{padding:8px;font-size:.84rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="brand">El Refugio<small>un mundo rural para habitar sin apuro</small></div><div class="head-actions"><button class="soft-btn" id="sound" aria-pressed="false">♫ Sonido ambiente</button><button class="soft-btn" id="lights">Luz</button></div></header>
<main class="world" id="world">
<section class="scene inside active" id="inside" aria-label="Interior de la casa visto desde dentro">
<div class="backwall"></div><div class="ceiling"></div><div class="floor"></div><div class="rug"></div><div class="windowframe"></div><div class="shelf"></div><div class="stove"></div><div class="table"></div><div class="chair">🪑</div><button class="hotspot" style="left:39%;top:57%" data-action="mate"><span class="big">🧉</span> Cebar unos mates</button><button class="hotspot" style="left:8%;top:61%" data-action="fire"><span class="big">🔥</span> Estufa a leña</button><button class="hotspot" style="right:6%;top:40%" data-scene="yard"><span class="big">🚪</span> Salir al patio</button><button class="hotspot" style="right:8%;bottom:12%" data-action="rest"><span class="big">🪑</span> Sentarse</button><button class="hotspot" style="left:8%;top:12%" data-action="books"><span class="big">📚</span> Leer</button><button class="hotspot" style="right:8%;top:15%" data-action="music"><span class="big">🎸</span> Escuchar música</button><button class="hotspot" style="left:39%;bottom:12%" data-action="cinema"><span class="big">📽️</span> Cine de la casa</button><div class="hint">Estás adentro. Mirá alrededor y elegí qué hacer; nadie te apura.</div>
</section>
<section class="scene yard" id="yard" aria-label="Patio rural patagónico en primera persona">
<div class="horizon-sky"></div><div class="sun"></div><div class="mountain"></div><div class="mountain back"></div><div class="ground"></div><div class="grass"></div><div class="path"></div><div class="tree">🌳</div><div class="barn"></div><div class="fence"></div><div class="well">🪣</div><div class="trough"></div><div class="scene-title">El patio · aire de campo</div><button class="animal hen" data-action="feedHen" aria-label="Dar de comer a la gallina">🐔</button><button class="animal duck" data-action="feedDuck" aria-label="Dar de comer a los patos">🦆</button><button class="animal dog" data-action="petDog" aria-label="Saludar al perro">🐕</button><button class="animal sheep" data-action="feedSheep" aria-label="Dar de comer a la oveja">🐑</button><button class="hotspot" style="left:5%;top:34%" data-action="water"><span class="big">💧</span> Llenar el bebedero</button><button class="hotspot" style="left:35%;top:55%" data-action="garden"><span class="big">🌱</span> Mirar la huerta</button><button class="hotspot" style="right:5%;top:45%" data-scene="field"><span class="big">🥾</span> Ir al campo</button><button class="hotspot" style="left:5%;bottom:37%" data-scene="inside"><span class="big">🏡</span> Volver a la casa</button><div class="hint" id="yardHint">El viento mueve los pastos. Los animales andan a su ritmo.</div>
</section>
<section class="scene field" id="field" aria-label="Campo abierto y corral">
<div class="horizon-sky"></div><div class="sun"></div><div class="mountain"></div><div class="mountain back"></div><div class="ground"></div><div class="grass"></div><div class="path"></div><div class="fence"></div><div class="barn"></div><div class="scene-title">El campo · tierra abierta</div><button class="animal sheep" data-action="feedSheep" aria-label="Alimentar la oveja">🐑</button><button class="animal dog" data-action="petDog" aria-label="Saludar al perro">🐕</button><button class="animal hen" data-action="feedHen" aria-label="Dar de comer a la gallina">🐔</button><button class="animal duck" data-action="feedDuck" aria-label="Dar de comer a los patos">🦆</button><button class="hotspot" style="left:5%;top:37%" data-action="look"><span class="big">🌾</span> Contemplar el paisaje</button><button class="hotspot" style="right:5%;top:43%" data-action="barn"><span class="big">🪵</span> Revisar el galpón</button><button class="hotspot" style="left:5%;bottom:37%" data-scene="yard"><span class="big">↩️</span> Volver al patio</button><div class="hint" id="fieldHint">No hay nada que terminar. Podés quedarte mirando el horizonte.</div>
</section>
<nav class="navbar" aria-label="Lugares del refugio"><button class="navbtn" data-scene="inside" aria-current="true">🏠 Casa</button><button class="navbtn" data-scene="yard">🌿 Patio</button><button class="navbtn" data-scene="field">🌾 Campo</button></nav>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><section class="dialog"><button class="x" id="close" aria-label="Cerrar">×</button><h2 id="dialogTitle"></h2><div id="dialogBody"></div></section></div>
<script>
(function(){
'use strict';
const scenes=[...document.querySelectorAll('.scene')],nav=[...document.querySelectorAll('.navbtn')],overlay=document.getElementById('overlay'),title=document.getElementById('dialogTitle'),body=document.getElementById('dialogBody'),toast=document.getElementById('toast');
let previousFocus=null,toastTimer=null,ambient=false,audioCtx=null,oscillators=[];
const saved=(k,v)=>{try{if(v===undefined)return localStorage.getItem('refugio_'+k);localStorage.setItem('refugio_'+k,v)}catch(e){return null}};
function say(message){toast.textContent=message;toast.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hidden'),4200)}
function go(id){scenes.forEach(s=>s.classList.toggle('active',s.id===id));nav.forEach(b=>b.setAttribute('aria-current',String(b.dataset.scene===id)));say(({inside:'Volviste al calor de la casa.',yard:'Saliste al patio. El aire está fresco y huele a tierra.',field:'Llegaste al campo abierto. No se escucha más que el viento.'})[id]);}
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.scene)));
const content={
mate:['La mesa matera','<p>La pava está tibia, el mate espera y afuera el viento pasa entre los álamos.</p><p>No hace falta hacer nada más. Si querés, dejá unas palabras en tu cuaderno.</p><label for="note">Cuaderno de la casa</label><textarea id="note" placeholder="Un pensamiento para dejar acá…"></textarea><div class="row"><button class="navbtn" id="saveNote">Guardar en este dispositivo</button></div><p class="status" id="noteStatus"></p>'],
fire:['La estufa a leña','<p>La leña cruje despacito. La luz tibia alcanza el piso de madera y la casa se vuelve un refugio contra el viento.</p><p>Podés quedarte acá el tiempo que quieras.</p><div class="media" style="display:grid;place-items:center;color:#ffd28b;font-size:5rem;background:radial-gradient(ellipse,#b94d24,#30251d 68%)">🔥</div>'],
rest:['Sentarse un rato','<p>Te acomodás en la silla. Por la ventana se ven las montañas y el patio. La casa no te pide que aproveches el tiempo.</p><p>Respirá con normalidad. Podés quedarte quieto todo lo que quieras.</p>'],
books:['El estante de los libros','<p><strong>El patio después de la lluvia</strong></p><p>La tierra todavía guarda el olor del agua. Una gallina cruza junto al alero; más lejos, el perro duerme con el hocico entre las patas. Desde la cocina llega el silbido de la pava. El día no tiene grandes noticias, y por eso mismo parece completo.</p><p>Acá iremos sumando relatos, historias rurales y lecturas que puedan abrirse sin salir del refugio.</p>'],
music:['La música de la casa','<p>Este rincón está preparado para reproducir música de YouTube o archivos de audio compatibles.</p><label for="mediaUrl">Enlace de música o archivo de audio</label><input id="mediaUrl" type="url" placeholder="Pegá un enlace de YouTube o .mp3"><div class="row"><button class="navbtn" id="play">▶ Escuchar</button><button class="navbtn" id="stop">Detener</button></div><div class="media" id="player"></div><p class="quiet">La reproducción externa necesita internet. Algunos enlaces no permiten inserción.</p><p class="status" id="mediaStatus"></p>'],
cinema:['El cine de la casa','<p>Apagamos un poco la luz y nos acomodamos. Pegá un enlace de YouTube o un archivo de video directo compatible.</p><label for="mediaUrl">Enlace de película o video</label><input id="mediaUrl" type="url" placeholder="Enlace de YouTube o archivo .mp4"><div class="row"><button class="navbtn" id="play">▶ Ver película</button><button class="navbtn" id="stop">Detener</button></div><div class="media" id="player"></div><p class="quiet">El refugio no aloja películas protegidas. La reproducción depende de la conexión y de los permisos del proveedor.</p><p class="status" id="mediaStatus"></p>'],
feedHen:['La gallina','<p>Te acercás despacio y esparcís un puñadito de granos. La gallina picotea el suelo, levanta la cabeza y sigue buscando.</p><button class="navbtn" id="feedAgain">Dejar otro puñado de granos</button><p class="status" id="feedStatus">La gallina está tranquila.</p>'],
feedDuck:['Los patos','<p>Dejás alimento cerca del bebedero. Los patos se arriman y chapotean un poco en el agua.</p><button class="navbtn" id="feedAgain">Darles un poco más</button><p class="status" id="feedStatus">Los patos siguen explorando el patio.</p>'],
feedSheep:['La oveja','<p>Te acercás al cerco y ofrecés un poco de pasto. La oveja mastica despacio y se queda cerca.</p><button class="navbtn" id="feedAgain">Ofrecer un poco más de pasto</button><p class="status" id="feedStatus">La oveja está comiendo tranquila.</p>'],
petDog:['El perro del patio','<p>El perro se acerca moviendo la cola, recibe unas caricias y después se echa a la sombra.</p><button class="navbtn" id="petAgain">Acariciarlo otra vez</button><p class="status" id="feedStatus">El perro se queda cerca.</p>'],
water:['El bebedero','<p>Agregás agua fresca al bebedero. El agua refleja un pedacito de cielo.</p><p>Una tarea pequeña, hecha sin apuro.</p>'],
garden:['La huerta','<p>La huerta es modesta: unas aromáticas, hojas verdes y tierra oscura. Podés regar un poco y volver a mirar cómo crece, sin calendarios ni obligaciones.</p><button class="navbtn" id="waterPlant">Regar la huerta</button><p class="status" id="gardenStatus"></p>'],
look:['Mirar el horizonte','<p>Las lomas se pierden a lo lejos. El viento mueve los pastos y las nubes avanzan lentamente.</p><p>No hay nada que alcanzar. Estás acá.</p>'],
barn:['El galpón','<p>Huele a madera, tierra y herramientas usadas. Contra la pared descansan una pala, una soga y un par de botas. Todo está listo para otro día de campo, pero hoy no hay apuro.</p>']
};
function openPanel(key){const item=content[key];if(!item)return;previousFocus=document.activeElement;title.textContent=item[0];body.innerHTML=item[1];overlay.classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').focus();setupPanel(key)}
function closePanel(){stopMedia();overlay.classList.remove('open');document.body.style.overflow='';if(previousFocus)previousFocus.focus()}
function stopMedia(){const p=document.getElementById('player');if(p)p.innerHTML=''}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.action)));
document.getElementById('close').addEventListener('click',closePanel);overlay.addEventListener('click',e=>{if(e.target===overlay)closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closePanel()});
function setupPanel(key){
if(key==='mate'){const n=document.getElementById('note');n.value=saved('note')||'';document.getElementById('saveNote').onclick=()=>{saved('note',n.value);document.getElementById('noteStatus').textContent='Quedó guardado en este dispositivo.'}}
if(['music','cinema'].includes(key)){const url=document.getElementById('mediaUrl'),player=document.getElementById('player'),status=document.getElementById('mediaStatus'),kind=key;url.value=saved('url_'+kind)||'';document.getElementById('play').onclick=()=>{let u;try{u=new URL(url.value.trim())}catch(e){status.textContent='Pegá un enlace completo y válido.';return}if(!['http:','https:'].includes(u.protocol)){status.textContent='Usá un enlace web.';return}saved('url_'+kind,u.href);player.innerHTML='';const host=u.hostname.replace(/^www\./,'').replace(/^m\./,''),path=u.pathname.toLowerCase();let id='';if(host==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';if(['youtube.com','youtube-nocookie.com'].includes(host)){id=u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);if(!id&&m)id=m[1]}if(['youtube.com','youtube-nocookie.com','youtu.be'].includes(host)){const list=u.searchParams.get('list'),src=list&&!id?'https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(list):id?'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0':'';if(!src){status.textContent='No pude reconocer el enlace de YouTube.';return}const f=document.createElement('iframe');f.src=src;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.title=kind==='music'?'Reproductor de música':'Cine de la casa';player.appendChild(f);status.textContent='Reproductor abierto. Algunos videos bloquean la reproducción integrada.';return}const isAudio=/\.(mp3|m4a|ogg|wav|aac)$/.test(path),isVideo=/\.(mp4|webm|ogv|mov)$/.test(path);if((kind==='music'&&isAudio)||(kind==='cinema'&&isVideo)){const m=document.createElement(kind==='music'?'audio':'video');m.src=u.href;m.controls=true;m.autoplay=true;m.playsInline=true;player.appendChild(m);m.play().catch(()=>status.textContent='Tocá reproducir en el control del archivo.');return}status.textContent='Este tipo de enlace puede impedir que se muestre dentro del refugio.'};document.getElementById('stop').onclick=()=>{player.innerHTML='';status.textContent='Reproducción detenida.'}}
if(['feedHen','feedDuck','feedSheep'].includes(key)){document.getElementById('feedAgain').onclick=()=>{document.getElementById('feedStatus').textContent='Le dejaste un poquito más. El animal sigue comiendo a su ritmo.'}}
if(key==='petDog')document.getElementById('petAgain').onclick=()=>document.getElementById('feedStatus').textContent='El perro mueve la cola y se acomoda a tu lado.';
if(key==='garden')document.getElementById('waterPlant').onclick=()=>document.getElementById('gardenStatus').textContent='La tierra quedó húmeda. Las plantas se mecen con la brisa.';
}
let dark=false;document.getElementById('lights').addEventListener('click',()=>{dark=!dark;document.querySelectorAll('.scene').forEach(s=>s.style.filter=dark?'brightness(.72) saturate(.8)':'');document.getElementById('lights').textContent=dark?'Volver a la luz':'Luz';say(dark?'La tarde se aquieta.':'La luz vuelve al patio.')});
function toggleAmbient(){if(ambient){oscillators.forEach(o=>{try{o.stop()}catch(e){}});oscillators=[];if(audioCtx){audioCtx.close();audioCtx=null}ambient=false;document.getElementById('sound').textContent='♫ Sonido ambiente';document.getElementById('sound').setAttribute('aria-pressed','false');return}try{const C=window.AudioContext||window.webkitAudioContext;if(!C){say('Este navegador no permite crear sonido ambiente.');return}audioCtx=new C();const gain=audioCtx.createGain();gain.gain.value=.018;gain.connect(audioCtx.destination);[110,164.8].forEach((hz,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=hz;g.gain.value=i?.3:.7;o.connect(g);g.connect(gain);o.start();oscillators.push(o)});ambient=true;document.getElementById('sound').textContent='♫ Silenciar ambiente';document.getElementById('sound').setAttribute('aria-pressed','true');say('Un murmullo suave acompaña la escena.')}catch(e){say('No se pudo iniciar el sonido en este navegador.')}}
document.getElementById('sound').addEventListener('click',toggleAmbient);
})();
</script>
</body></html>
